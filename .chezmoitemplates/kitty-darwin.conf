# Theme generated from the selected Ghostty theme.
globinclude ../theme-sync/generated/kitty.conf

window_padding_width 0
window_margin_width 0

# BEGIN_KITTY_FONTS
font_family      family="JetBrainsMono Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

shell_integration no-cursor
macos_option_as_alt yes

# macOS text system eats Ctrl-Space; send NUL so tmux receives it.
map ctrl+space send_text all \x00

# Use fish as the default shell
shell /opt/homebrew/bin/fish

globinclude kitty-override.conf
